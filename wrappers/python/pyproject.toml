[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "postseed"
version = "0.1.0"
description = "Realistic, relationship-correct seed data for PostgreSQL. Local-first and deterministic. Runs the Postseed CLI and Studio with Node.js."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Sagar Pinninti" }]
keywords = ["postgres", "postgresql", "seed", "seed-data", "fake-data", "test-data", "fixtures", "faker", "deterministic", "database"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Testing",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/isagarpinninti/postseed"
Documentation = "https://github.com/isagarpinninti/postseed#readme"
Issues = "https://github.com/isagarpinninti/postseed/issues"
Changelog = "https://github.com/isagarpinninti/postseed/blob/main/CHANGELOG.md"

[project.scripts]
postseed = "postseed.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
postseed = ["_engine/**/*", "studio-dist/**/*"]
